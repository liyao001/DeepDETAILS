[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "DeepDETAILS"
dynamic = ["version"]
description = "Deep-learning-based DEconvolution of Tissue profiles with Accurate Interpretation of Locus-specific Signals"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
keywords = []
authors = [
  { name = "Li Yao", email = "regulatorygenome@gmail.com" },
]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "torch", "numpy", "pandas", "h5py", "pyfaidx",
  "pytorch-lightning", "torchmetrics", "einops",
  "matplotlib", "tqdm", "biopython", "scikit-learn",
  "pyBigWig", "pybedtools", "tensorboard",
  "scipy>=1.11.1", "wandb"
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=6.5",
  "pytest",
  "pytest-testmon",
  "pytest-xdist",
  "pylint",
  "ruff",
  "twine",
  "vulture",
]

[project.scripts]
deepdetails = "deepdetails.cli:deepdetails"

[project.urls]
Documentation = "https://github.com/liyao001/DeepDETAILS"
Issues = "https://github.com/liyao001/DeepDETAILS/issues"
Source = "https://github.com/liyao001/DeepDETAILS"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
# Historical tags like 0.1.0dev4 yield non-PEP-440 versions when combined with
# distance metadata; ignore them and use clean numeric release tags instead.
version_scheme = "post-release"
git_describe_command = "git describe --dirty --tags --long --match [0-9]* --match v[0-9]* --exclude *dev*"

[tool.hatch.build.hooks.vcs]
version-file = "src/deepdetails/_version.py"

[tool.hatch.envs.default]
features = ["dev"]
[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-data = "pytest -m data {args:tests}"
test-fast = "pytest -m 'not train and not gpu' {args:tests}"
test-train = "pytest -m train {args:tests}"
test-unit = "pytest -m unit {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
lint = "ruff check {args:.}"
check-typos = "typos --config .typos.toml {args:.}"
check-dist = "twine check {args:dist/*}"
cov-report = [
  "- coverage combine",
  "coverage report",
]
cov = [
  "test-cov",
  "cov-report",
]

[[tool.hatch.envs.all.matrix]]
python = ["3.10", "3.11", "3.12", "3.13"]

[tool.hatch.envs.hatch-check-types]
config-path = "pyrefly.toml"

[tool.coverage.run]
source_pkgs = ["deepdetails", "tests"]
branch = true
parallel = true
omit = [
  "src/deepdetails/__about__.py",
  "src/deepdetails/_version.py",
]

[tool.coverage.paths]
deepdetails = ["src/deepdetails", "*/deepdetails/src/deepdetails"]
tests = ["tests", "*/deepdetails/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "data: tests that require bundled genomics fixture files and external bioinformatics libraries",
  "gpu: tests that require GPU hardware",
  "train: tests that exercise model training or trainer orchestration",
  "unit: fast tests for isolated Python logic",
]

[tool.ruff]
target-version = "py310"
extend-exclude = [
  ".vulture_whitelist.py",
  "dist",
  "scripts",
  "tests",
  "wandb",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Pixi workspace.
#   pixi shell              runtime env (CLI + bedtools / bedGraphToBigWig)
#   pixi shell -e dev       plus hatch, pytest, ruff, typos, twine
#   pixi run -e dev test    developer tasks
[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
bedtools = "*"
python = ">=3.10,<3.14"
ucsc-bedgraphtobigwig = "*"
libcurl = ">=8.21.0,<9"

[tool.pixi.pypi-dependencies]
deepdetails = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
hatch = "*"
ruff = "*"
twine = "*"
typos = "*"

# `dev` optional-dependencies (pytest, ruff, ...) are pulled in via features = ["dev"]

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

# Developer tasks live on the dev feature so `pixi run test` selects that env.
[tool.pixi.feature.dev.tasks]
check = "hatch check"
check-code = "hatch check code"
check-fmt = "hatch check fmt"
check-types = "hatch check types"
lint = "hatch run lint"
ruff = "hatch run lint"
typos = "hatch run check-typos"
test = "hatch run test"
test-data = "hatch run test-data"
test-fast = "hatch run test-fast"
test-train = "hatch run test-train"
test-unit = "hatch run test-unit"
build = "hatch build"
check-dist = "hatch run check-dist"
ci = { depends-on = ["check", "typos", "test-fast", "build", "check-dist"] }
