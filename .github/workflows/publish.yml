name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:

    runs-on: ubuntu-latest

    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y bedtools
        sudo curl -fsSL -o /usr/local/bin/bedGraphToBigWig \
          https://hgdownload.soe.ucsc.edu/admin/exe/linux.x86_64/bedGraphToBigWig
        sudo chmod +x /usr/local/bin/bedGraphToBigWig
        python -m pip install --upgrade pip 
        python -m pip install hatch twine

    - name: Verify tag matches package version
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        PACKAGE_VERSION=$(hatch version)
        TAG_VERSION=${GITHUB_REF_NAME#v}
        test "$TAG_VERSION" = "$PACKAGE_VERSION"

    - name: Build package
      run: hatch build

    - name: Test package
      run: hatch test -s

    - name: Check package metadata
      run: twine check dist/*

    - name: Upload release artifacts
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*

    - name: Publish on PyPI
      if: startsWith(github.ref, 'refs/tags/')
      uses: pypa/gh-action-pypi-publish@release/v1
